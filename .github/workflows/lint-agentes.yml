name: Conferir ferramentas dos agentes
on:
  push:
    paths:
      - 'agente-conteudo/automacao/**'
      - 'agente-conteudo/agentes/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-agentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Compilar no Python do Mac (3.9)
        run: python3 -m py_compile agente-conteudo/automacao/squad.py agente-conteudo/automacao/copywriter_paralelo.py
      - run: python3 agente-conteudo/automacao/squad.py lint-agentes
