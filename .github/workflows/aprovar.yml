name: Aprovar pelo painel
on:
  issues:
    types: [opened]
concurrency:
  group: aprovar
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  aprovar:
    if: github.event.issue.user.login == 'daninaka-hub' && (startsWith(github.event.issue.title, 'Aprovar ') || startsWith(github.event.issue.title, 'Reprovar ') || startsWith(github.event.issue.title, 'Agendar publicação: ') || startsWith(github.event.issue.title, 'Marcar como publicado: '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar aprovação
        env:
          TITULO: ${{ github.event.issue.title }}
          CORPO: ${{ github.event.issue.body }}
          NUM: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          TYPEFULLY_SOCIAL_SET_ID: ${{ secrets.TYPEFULLY_SOCIAL_SET_ID }}
        run: |
          RES=$(python3 agente-conteudo/automacao/squad.py aprovar "$TITULO" "$CORPO")
          python3 agente-conteudo/automacao/squad.py gerar-pagina
          git config user.name "bxai-bot"
          git config user.email "bxai-bot@users.noreply.github.com"
          git add -A agente-conteudo
          git commit -m "Painel: $TITULO" || true
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 3; done
          gh workflow run pages.yml || true
          gh issue comment "$NUM" --body "$RES"
          gh issue close "$NUM"
