<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#062D3E"/>
  <rect x="0" y="0" width="10" height="630" fill="#19B09F"/>
  <rect x="14" y="0" width="2" height="630" fill="#19B09F" opacity="0.35"/>

  <text x="72" y="90" font-size="16" font-weight="bold" letter-spacing="3" fill="#19B09F">ZILLOW OFFERS &#183; 2021</text>

  <text x="72" y="210" font-size="108" font-weight="bold" fill="#FFFFFF">US$ 500M</text>

  <text x="72" y="256" font-size="24" fill="#D7E7E4">perdidos comprando casas com um algoritmo</text>
  <text x="72" y="286" font-size="24" fill="#D7E7E4">de &#250;ltima gera&#231;&#227;o</text>

  <line x1="72" y1="320" x2="632" y2="320" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <text x="72" y="362" font-size="26" font-weight="bold" fill="#19B09F">O erro n&#227;o estava no algoritmo.</text>

  <text x="72" y="592" font-size="13" fill="#6E8A90">Fonte: SphereOI, &#8220;How Zillow could have avoided its $500M AI mistake&#8221;</text>

  <!-- chart -->
  <g transform="translate(700,170)">
    <line x1="30" y1="20" x2="30" y2="300" stroke="#2E5666" stroke-width="2"/>
    <line x1="30" y1="300" x2="440" y2="300" stroke="#2E5666" stroke-width="2"/>

    <polyline points="30,90 110,100 180,150 250,210 320,255 400,278" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="30,70 110,78 180,95 250,130 320,175 400,215" fill="none" stroke="#19B09F" stroke-width="4" stroke-dasharray="10,8" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="320" y1="175" x2="320" y2="255" stroke="#F2A541" stroke-width="2" stroke-dasharray="3,4"/>
    <circle cx="320" cy="175" r="5" fill="#19B09F"/>
    <circle cx="320" cy="255" r="5" fill="#FFFFFF"/>
    <text x="332" y="220" font-size="15" font-weight="bold" fill="#F2A541">gap de 30 dias</text>

    <g transform="translate(0,330)">
      <line x1="0" y1="0" x2="26" y2="0" stroke="#FFFFFF" stroke-width="4"/>
      <text x="34" y="5" font-size="14" fill="#D7E7E4">pre&#231;o real do mercado</text>
    </g>
    <g transform="translate(230,330)">
      <line x1="0" y1="0" x2="26" y2="0" stroke="#19B09F" stroke-width="4" stroke-dasharray="6,5"/>
      <text x="34" y="5" font-size="14" fill="#D7E7E4">pre&#231;o assumido pelo algoritmo</text>
    </g>
