<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#062D3E"/>
  <rect x="0" y="0" width="1200" height="8" fill="#19B09F"/>

  <text x="600" y="78" font-size="15" font-weight="bold" letter-spacing="3" fill="#19B09F" text-anchor="middle">KRAFT HEINZ &#183; 2016&#8211;2023</text>

  <text x="600" y="220" font-size="150" font-weight="bold" fill="#FFFFFF" text-anchor="middle">~300</text>
  <text x="600" y="256" font-size="26" fill="#D7E7E4" text-anchor="middle">transa&#231;&#245;es falsas sustentaram o esquema por anos</text>

  <!-- horizontal timeline strip -->
  <g transform="translate(72,380)">
    <line x1="0" y1="110" x2="1056" y2="110" stroke="#2E5666" stroke-width="2"/>
    <rect x="60" y="80" width="140" height="30" fill="#19B09F" opacity="0.5"/>
    <rect x="320" y="60" width="140" height="50" fill="#19B09F" opacity="0.68"/>
    <rect x="580" y="32" width="140" height="78" fill="#19B09F" opacity="0.85"/>
    <rect x="840" y="0" width="140" height="110" fill="#19B09F"/>

    <text x="130" y="135" font-size="15" fill="#D7E7E4" text-anchor="middle">2016</text>
    <text x="390" y="135" font-size="15" fill="#D7E7E4" text-anchor="middle">2017</text>
    <text x="650" y="135" font-size="15" fill="#D7E7E4" text-anchor="middle">2018</text>
    <text x="910" y="135" font-size="15" fill="#D7E7E4" text-anchor="middle">2019</text>

    <line x1="840" y1="-10" x2="980" y2="-10" stroke="#F2A541" stroke-width="2" stroke-dasharray="3,4"/>
    <text x="910" y="-18" font-size="14" font-weight="bold" fill="#F2A541" text-anchor="middle">descoberto</text>
  </g>

  <text x="600" y="565" font-size="24" font-weight="bold" fill="#19B09F" text-anchor="middle">Ningu&#233;m perguntava de onde vinha o n&#250;mero.</text>
  <text x="72" y="612" font-size="13" fill="#6E8A90">Fonte: SEC, sec.gov (2021) e The D&amp;O Diary, dandodiary.com (2023)</text>
</svg>
