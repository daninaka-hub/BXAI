  <g transform="translate(790,160)">
    <line x1="30" y1="20" x2="30" y2="400" stroke="#2E5666" stroke-width="2"/>
    <line x1="30" y1="400" x2="310" y2="400" stroke="#2E5666" stroke-width="2"/>

    <rect x="70" y="52" width="90" height="348" fill="#19B09F"/>
