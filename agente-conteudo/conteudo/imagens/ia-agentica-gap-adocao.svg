  <rect x="14" y="0" width="2" height="630" fill="#19B09F" opacity="0.35"/>

  <text x="72" y="90" font-size="16" font-weight="bold" letter-spacing="3" fill="#19B09F">IA AG&#202;NTICA EM FINAN&#199;AS &#183; 2025</text>

  <text x="72" y="150" font-size="40" font-weight="bold" fill="#FFFFFF">99% das empresas dizem</text>
  <text x="72" y="196" font-size="40" font-weight="bold" fill="#FFFFFF">que v&#227;o usar IA ag&#234;ntica.</text>
  <text x="72" y="242" font-size="40" font-weight="bold" fill="#FFFFFF">S&#243; 11% realmente usam.</text>

  <line x1="72" y1="276" x2="572" y2="276" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <text x="72" y="318" font-size="26" font-weight="bold" fill="#19B09F">O gargalo n&#227;o &#233; tecnologia. &#201; governan&#231;a.</text>

